name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install -g @capacitor/assets
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          META_DATA='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~2959860271"/>'
          sed -i "/<\/application>/i \        $META_DATA" $MANIFEST

      - name: Generate App Icons from Logo
        run: |
          if [ -f "www/logo.png" ]; then
            cp www/logo.png icon.png
            npx @capacitor/assets generate --iconOnly || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiReels-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiReels-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
