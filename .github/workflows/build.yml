name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Sync Capacitor
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Create Keystore & Export PEM Certificate
      run: |
        cd android
        keytool -genkey -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass bhakti123 -keypass bhakti123 -dname "CN=BhaktiReels, OU=App, O=Jagatpal, L=Lucknow, ST=UP, C=IN"
        keytool -export -rfc -keystore upload-keystore.jks -alias upload -file upload_certificate.pem -storepass bhakti123
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass bhakti123 -keypass bhakti123 app/build/outputs/bundle/release/app-release.aab upload

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BhaktiReels-Signed-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab

    - name: Upload PEM Certificate
      uses: actions/upload-artifact@v4
      with:
        name: Upload-Certificate-PEM
        path: android/upload_certificate.pem
