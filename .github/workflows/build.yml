name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Add Android
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Update Target SDK to 36 and Version Code to 2
      run: |
        # versionCode 1 को 2 में बदलें
        sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
        # versionName "1.0" को "1.0.1" करें
        sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle
        # targetSdkVersion को 36 सेट करें
        sed -i 's/targetSdkVersion project.hasProperty.*rootProject.ext.targetSdkVersion : [0-9]*/targetSdkVersion 36/g' android/app/build.gradle

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Sign Android App Bundle
      run: |
        cd android
        keytool -genkey -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass bhakti123 -keypass bhakti123 -dname "CN=BhaktiReels, OU=App, O=Jagatpal, L=Lucknow, ST=UP, C=IN"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass bhakti123 -keypass bhakti123 app/build/outputs/bundle/release/app-release.aab upload

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BhaktiReels-Signed-AAB-v2
        path: android/app/build/outputs/bundle/release/app-release.aab
