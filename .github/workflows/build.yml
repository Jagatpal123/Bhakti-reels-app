name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Add Android
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Configure SDK Versions and Version Code
      run: |
        # variables.gradle में minSdkVersion 24 और targetSdkVersion 36 सेट करें
        sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle

        # app/build.gradle में versionCode को 4 और versionName को 1.0.3 करें
        sed -i 's/versionCode 1/versionCode 4/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.3"/g' android/app/build.gradle

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Sign Android App Bundle with Saved Keystore
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 android/app/build/outputs/bundle/release/app-release.aab bhakti

    - name: Upload Final Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BhaktiReels-Final-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
