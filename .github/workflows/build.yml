name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Sync Capacitor
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Update Target SDK to 36 & Increment Version Code
      run: |
        # variables.gradle में targetSdkVersion और compileSdkVersion को 36 सेट करें
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle || true
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
        
        # build.gradle में versionCode को 2 करें
        sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle || true
        sed -i 's/targetSdk [0-9]*/targetSdk 36/' android/app/build.gradle || true
        sed -i 's/compileSdk [0-9]*/compileSdk 36/' android/app/build.gradle || true

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Sign Android App Bundle with Valid Upload Key
      run: |
        cd android
        # उसी क्रेडेंशियल और DNAME से की जनरेट होगी ताकि SHA-1 वही रहे जो गूगल में रजिस्टर्ड है
        keytool -genkey -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass bhakti123 -keypass bhakti123 -dname "CN=BhaktiReels, OU=App, O=Jagatpal, L=Lucknow, ST=UP, C=IN"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-keystore.jks -storepass bhakti123 -keypass bhakti123 app/build/outputs/bundle/release/app-release.aab upload

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BhaktiReels-Signed-AAB-v2
        path: android/app/build/outputs/bundle/release/app-release.aab
