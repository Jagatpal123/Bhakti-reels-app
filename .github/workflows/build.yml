name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          META_DATA='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~2959860271"/>'
          sed -i "/<\/application>/i \        $META_DATA" $MANIFEST

      - name: Overwrite Icons and Delete Adaptive XMLs
        run: |
          RES_DIR="android/app/src/main/res"

          # Delete anydpi adaptive XMLs so Android is forced to use our PNG directly
          rm -rf $RES_DIR/mipmap-anydpi-v26

          # Generate direct launcher and round PNGs
          convert www/logo.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert www/logo.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          convert www/logo.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_foreground.png

          convert www/logo.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert www/logo.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          convert www/logo.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_foreground.png

          convert www/logo.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert www/logo.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert www/logo.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png

          convert www/logo.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert www/logo.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert www/logo.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png

          convert www/logo.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          convert www/logo.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          convert www/logo.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiReels-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhaktiReels-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
