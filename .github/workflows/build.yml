name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Add Android
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Set Target SDK 36, Min SDK 24 & Version Code 3
      run: |
        # Version code को 3 और Version Name को 1.0.2 करें
        sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.2"/g' android/app/build.gradle
        
        # minSdkVersion को 24 और targetSdkVersion को 36 सेट करें
        sed -i 's/minSdkVersion project.hasProperty.*rootProject.ext.minSdkVersion : [0-9]*/minSdkVersion 24/g' android/app/build.gradle
        sed -i 's/targetSdkVersion project.hasProperty.*rootProject.ext.targetSdkVersion : [0-9]*/targetSdkVersion 36/g' android/app/build.gradle

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Sign Android App Bundle with Saved Keystore
      run: |
        # रूट में अपलोड की गई release.keystore से साइन करें
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 android/app/build/outputs/bundle/release/app-release.aab bhakti

    - name: Upload Final Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BhaktiReels-Final-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
