name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/android

    - name: Build Web Assets & Add Android
      run: |
        npm run build --if-present
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Set Target SDK 36 & Version Code 2
      run: |
        sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle
        sed -i 's/targetSdkVersion project.hasProperty.*rootProject.ext.targetSdkVersion : [0-9]*/targetSdkVersion 36/g' android/app/build.gradle

    - name: Build Android Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Generate Keystore, PEM & Sign Bundle
      run: |
        cd android
        keytool -genkeypair -v -keystore release.keystore -alias bhakti -keyalg RSA -keysize 2048 -validity 10000 -storepass Jagatpal@2026 -keypass Jagatpal@2026 -dname "CN=BhaktiReels, OU=App, O=Jagatpal, L=Lucknow, ST=UP, C=IN"
        keytool -export -rfc -keystore release.keystore -alias bhakti -file upload_cert.pem -storepass Jagatpal@2026
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 app/build/outputs/bundle/release/app-release.aab bhakti

    - name: Upload Final Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Final-Release-Files
        path: |
          android/app/build/outputs/bundle/release/app-release.aab
          android/upload_cert.pem
          android/release.keystore
